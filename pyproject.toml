[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-chat-api"
version = "0.1.0"
description = "Recruiter chat API for Hassan Ahmed's portfolio"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "psycopg[binary]",
    "python-dotenv",
    "fastapi[standard]",
]

[tool.setuptools]
py-modules = ["main"]
packages = []

[tool.fastapi]
entrypoint = "main:app"
