services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hassan
      POSTGRES_PASSWORD: hassan
      POSTGRES_DB: portfolio
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: